<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#9fdcff">
<meta name="apple-mobile-web-app-title" content="Sparkle Kingdom">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Sparkle Kingdom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700;900&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: full-screen 3D canvas with storybook "sticker" HUD pinned to the corners.
   Single visual world (a sunny kingdom), so one palette for every host theme. */
:root {
  --ink: #2c1745;        /* plum ink for text */
  --rose: #ff4f93;       /* royal pink accent */
  --blush: #ffe0ee;      /* soft pink fills */
  --gold: #ffc23a;       /* crown gold */
  --cream: #fffaf2;      /* sticker paper */
  --sky: #9fdcff;        /* page ground behind the canvas */
  --mint: #4fd6a5;       /* "go" green */
  --shadow: rgba(60, 20, 80, 0.28);
  --font-display: "Grandstander", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
  --font-body: "Nunito", "Avenir Next", system-ui, sans-serif;
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px);
  color-scheme: light;
}
[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; background: var(--sky); }
body { height: 100%; margin: 0; overflow: hidden; background: var(--sky); color: var(--ink);
  font-family: var(--font-body); -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
#app { position: relative; width: 100%; height: 100%; overflow: hidden; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; }

/* sticker look: paper fill, thick white edge, soft drop */
.sticker { background: var(--cream); border: 4px solid #fff; border-radius: 22px;
  box-shadow: 0 6px 0 rgba(44, 23, 69, 0.12), 0 10px 24px var(--shadow); }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
.crown { position: absolute; top: calc(12px + var(--st)); left: calc(12px + var(--sl)); display: flex; align-items: center; gap: 6px;
  padding: 8px 12px 8px 10px; }
.crown svg.c { width: 30px; height: 30px; flex: none; }
.gem { width: 22px; height: 22px; flex: none; clip-path: polygon(50% 0, 100% 38%, 78% 100%, 22% 100%, 0 38%);
  background: #e7dcef; transition: transform .4s cubic-bezier(.3,1.8,.5,1); }
.gem.on { transform: scale(1.18); }
.mission { position: absolute; top: calc(12px + var(--st)); left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 10px;
  max-width: min(46vw, 420px); min-width: 0; }
.m-icon { font-size: 30px; line-height: 1; flex: none; }
.m-text { font-family: var(--font-display); font-weight: 900; font-size: 18px; line-height: 1.1;
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m-count { font-family: var(--font-display); font-weight: 900; font-size: 20px; flex: none;
  background: var(--rose); color: #fff; border-radius: 999px; padding: 2px 12px;
  font-variant-numeric: tabular-nums; }
.m-count:empty { display: none; }
.top-btns { position: absolute; top: calc(12px + var(--st)); right: calc(12px + var(--sr)); display: flex; gap: 10px; }
.round { width: 56px; height: 56px; display: grid; place-items: center; padding: 0; border-radius: 50%; }
.round svg { width: 28px; height: 28px; }
.round.off { opacity: .55; }
.jump { position: absolute; right: calc(18px + var(--sr)); bottom: calc(22px + var(--sb)); width: 96px; height: 96px; border-radius: 50%;
  background: var(--rose); color: #fff; border: 5px solid #fff;
  font-family: var(--font-display); font-weight: 900; font-size: 22px; letter-spacing: .02em;
  box-shadow: 0 7px 0 #c2266a, 0 14px 26px var(--shadow); display: grid; place-items: center; }
.jump:active { transform: translateY(5px); box-shadow: 0 2px 0 #c2266a, 0 8px 18px var(--shadow); }
.jump svg { width: 34px; height: 34px; margin-bottom: -6px; }
.hint { position: absolute; left: calc(16px + var(--sl)); bottom: calc(30px + var(--sb)); max-width: calc(100% - 150px);
  font-family: var(--font-display); font-weight: 900; font-size: 18px; line-height: 1.15; padding: 10px 16px;
  transition: opacity .5s; }
.hint.gone { opacity: 0; pointer-events: none; }

/* ---------- speech bubble ---------- */
#dialog { position: absolute; inset: auto 0 0 0; display: flex; justify-content: center;
  padding: 0 14px calc(18px + var(--sb)); pointer-events: none; }
.bubble { pointer-events: auto; width: min(560px, 100%); padding: 16px 18px 16px; display: grid;
  grid-template-columns: auto 1fr; grid-template-areas: "face text" "face ok"; column-gap: 14px; row-gap: 10px;
  align-items: center; animation: pop .35s cubic-bezier(.3,1.6,.5,1); }
.face { grid-area: face; width: 76px; height: 76px; border-radius: 50%; background: var(--blush);
  display: grid; place-items: center; font-size: 46px; border: 4px solid #fff;
  box-shadow: 0 0 0 3px var(--rose); overflow: hidden; align-self: start; }
.face img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; }
.say { grid-area: text; min-width: 0; }
.who { font-family: var(--font-display); font-weight: 900; color: var(--rose); font-size: 17px; letter-spacing: .02em; }
.say p { margin: 2px 0 0; font-size: 21px; line-height: 1.3; font-weight: 800; text-wrap: balance; }
.ok { grid-area: ok; justify-self: end; background: var(--mint); color: #0f3d2e; border: 4px solid #fff;
  border-radius: 999px; padding: 10px 26px; font-family: var(--font-display); font-weight: 900; font-size: 22px;
  box-shadow: 0 5px 0 #23a879, 0 10px 18px var(--shadow); }
.ok:active { transform: translateY(4px); box-shadow: 0 1px 0 #23a879, 0 6px 12px var(--shadow); }
@keyframes pop { from { transform: scale(.6) translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- title + finale ---------- */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
  justify-content: flex-end; gap: 14px; padding: 24px 16px calc(40px + var(--sb)); text-align: center;
  background: linear-gradient(to top, rgba(44, 23, 69, .55), rgba(44, 23, 69, 0) 55%); }
.screen h1 { margin: 0; font-family: var(--font-display); font-weight: 900; color: #fff;
  font-size: clamp(44px, 11vw, 92px); line-height: .92; letter-spacing: -.01em; text-wrap: balance;
  text-shadow: 0 4px 0 var(--rose), 0 8px 0 rgba(44,23,69,.35); }
.screen .sub { margin: 0; color: #fff; font-weight: 900; font-size: 19px; letter-spacing: .04em;
  text-shadow: 0 2px 6px rgba(44,23,69,.6); }
.big { background: var(--gold); color: var(--ink); border: 5px solid #fff; border-radius: 999px;
  padding: 14px 54px; font-family: var(--font-display); font-weight: 900; font-size: 34px;
  box-shadow: 0 8px 0 #d18f00, 0 16px 30px rgba(44,23,69,.35); animation: breathe 1.6s ease-in-out infinite; }
.big:active { transform: translateY(6px); box-shadow: 0 2px 0 #d18f00, 0 8px 16px rgba(44,23,69,.35); }
.small { background: rgba(255,255,255,.88); color: var(--ink); border-radius: 999px; padding: 8px 18px;
  font-weight: 900; font-size: 15px; }
@keyframes breathe { 50% { transform: scale(1.06); } }
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; background: var(--sky);
  font-family: var(--font-display); font-weight: 900; font-size: 26px; color: var(--ink); text-align: center; padding: 16px; }
#toast { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(.5); opacity: 0;
  font-family: var(--font-display); font-weight: 900; font-size: clamp(36px, 9vw, 64px); color: #fff;
  text-shadow: 0 4px 0 var(--rose), 0 8px 18px rgba(44,23,69,.4); pointer-events: none; white-space: nowrap;
  transition: transform .45s cubic-bezier(.3,1.7,.5,1), opacity .3s; }
#toast.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }

/* ---------- thinking puzzle ---------- */
#quiz { position: absolute; inset: auto 0 0 0; display: flex; justify-content: center; padding: 0 14px calc(18px + var(--sb)); }
.qcard { width: min(560px, 100%); padding: 16px 18px 18px; display: grid; gap: 14px; animation: pop .35s cubic-bezier(.3,1.6,.5,1); }
.qhead { display: flex; gap: 12px; align-items: center; min-width: 0; }
.qhead .face { width: 64px; height: 64px; font-size: 36px; flex: none; }
.qhead .say { flex: 1; }
.qhead .round { flex: none; width: 48px; height: 48px; }
.opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.opt { aspect-ratio: 1; display: grid; place-items: center; padding: 6px; border-radius: 22px; overflow: hidden; }
.opt .emo { font-size: clamp(24px, 6.4vw, 40px); line-height: 1.15; text-align: center; word-break: break-all; }
.opt img { width: 88%; height: 88%; object-fit: cover; border-radius: 50%; }
.opt .dot { width: 62%; height: 62%; border-radius: 50%; box-shadow: inset 0 -7px 0 rgba(0,0,0,.15), 0 3px 8px rgba(44,23,69,.2); }
.opt.right { background: #dcffec; box-shadow: 0 0 0 5px var(--mint), 0 10px 24px var(--shadow); transform: scale(1.06); transition: transform .2s; }
.opt.glow { animation: glowpulse 1s ease-in-out infinite; box-shadow: 0 0 0 5px var(--gold), 0 10px 24px var(--shadow); }
.opt.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-9px); } 40%, 80% { transform: translateX(9px); } }
@keyframes glowpulse { 50% { transform: scale(1.08); } }

@media (max-width: 640px) {
  .mission { top: calc(80px + var(--st)); max-width: calc(100vw - 32px); }
  .m-text { font-size: 17px; }
  .round { width: 52px; height: 52px; }
  .jump { width: 84px; height: 84px; font-size: 19px; }
  .say p { font-size: 19px; }
  .face { width: 64px; height: 64px; font-size: 38px; }
}
@media (prefers-reduced-motion: reduce) { .big { animation: none; } .bubble { animation: none; } }
</style>

</head>
<body>
<div id="app">
  <canvas id="scene" aria-label="Sparkle Kingdom game world"></canvas>

  <div id="hud" hidden>
    <div class="crown sticker" aria-label="Crown gems">
      <svg class="c" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 24 L3 9 L10 15 L16 5 L22 15 L29 9 L28 24 Z" fill="#ffc23a" stroke="#d18f00" stroke-width="2" stroke-linejoin="round"/><rect x="4" y="24" width="24" height="4" rx="2" fill="#ffb000"/></svg>
      <span class="gem" id="gem0"></span><span class="gem" id="gem1"></span><span class="gem" id="gem2"></span><span class="gem" id="gem3"></span><span class="gem" id="gem4"></span>
    </div>
    <div class="mission sticker" id="mission"><span class="m-icon" id="mIcon"></span><span class="m-text" id="mText"></span><span class="m-count" id="mCount"></span></div>
    <div class="top-btns">
      <button class="round sticker" id="btnVoice" aria-label="Hear it again"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#2c1745"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#ff4f93" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg></button>
      <button class="round sticker" id="btnSound" aria-label="Music on or off"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l11-2v12" stroke="#2c1745" stroke-width="2.4" fill="none" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="3" fill="#ff4f93"/><circle cx="17.5" cy="16" r="3" fill="#ff4f93"/></svg></button>
    </div>
    <div class="hint sticker" id="hint">Tap the ground to walk!</div>
    <button class="jump" id="btnJump" aria-label="Jump"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.4 6.6L21 9.5l-5.2 4.3L17.6 21 12 17.2 6.4 21l1.8-7.2L3 9.5l6.6-.9z" fill="#fff"/></svg>Jump</button>
  </div>

  <div id="dialog" hidden>
    <div class="bubble sticker" role="dialog" aria-live="polite">
      <div class="face" id="dFace"></div>
      <div class="say"><div class="who" id="dName"></div><p id="dText"></p></div>
      <button class="ok" id="dOk">OK!</button>
    </div>
  </div>

  <div id="quiz" hidden>
    <div class="qcard sticker" role="dialog" aria-live="polite">
      <div class="qhead"><div class="face" id="qFace"></div><div class="say"><div class="who" id="qName"></div><p id="qText"></p></div>
        <button class="round sticker" id="qVoice" aria-label="Hear the question again"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#2c1745"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#ff4f93" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg></button></div>
      <div class="opts" id="qOpts"></div>
    </div>
  </div>

  <div id="title" class="screen">
    <h1>Sparkle<br>Kingdom</h1>
    <p class="sub">Princess Luna's adventure</p>
    <button class="big" id="btnPlay">Play</button>
    <button class="small" id="btnNew" hidden>Start a new adventure</button>
  </div>

  <div id="finale" class="screen" hidden>
    <h1>Hooray,<br>Princess!</h1>
    <p class="sub">You helped all your friends and filled your crown!</p>
    <div class="row"><button class="big" id="btnAgain">Play again</button></div>
    <button class="small" id="btnExplore">Keep exploring</button>
  </div>

  <div id="toast"></div>
  <div id="loading">Opening the castle gates…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>

/* ---------- terrain ---------- */
const ISLAND_R = 52, WALK_R = 45;
const CASTLE = { x: 0, z: -40 }, POND = { x: 27, z: 17, r: 7.5 };
function islandRadius(a) { return ISLAND_R + 3 * Math.sin(3 * a + 0.5) + 2 * Math.cos(5 * a); }
function heightAt(x, z) {
  let h = 0.95 + 0.65 * (0.55 * Math.sin(x * 0.09 + 1) * Math.cos(z * 0.08) + 0.35 * Math.sin((x - z) * 0.06) + 0.22 * Math.cos(x * 0.15 + z * 0.11));
  const dc = Math.hypot(x - CASTLE.x, z - CASTLE.z); h = lerp(0.95, h, smooth(14, 26, dc));
  const dp = Math.hypot(x - POND.x, z - POND.z); h = lerp(-1.3, h, smooth(POND.r - 1.5, POND.r + 2.5, dp));
  const r = Math.hypot(x, z), R = islandRadius(Math.atan2(z, x));
  h = lerp(h, 0.05, smooth(R - 9, R - 2, r));
  if (r > R - 2) h -= (r - (R - 2)) * 0.32;
  return h;
}
const PATHS = [[0, -28, 0, 0], [0, 0, -20, -5], [0, 0, 21, -4], [0, 0, 7, 24], [0, 0, 22, 8]];
function pathDist(x, z) {
  let d = 1e9;
  for (const [ax, az, bx, bz] of PATHS) {
    const vx = bx - ax, vz = bz - az, t = clamp(((x - ax) * vx + (z - az) * vz) / (vx * vx + vz * vz), 0, 1);
    d = Math.min(d, Math.hypot(x - ax - vx * t, z - az - vz * t));
  }

}
let GROUND = null;
(function buildTerrain() {
  const size = 150, seg = IS_MOBILE ? 120 : 160;
  const geo = new THREE.PlaneGeometry(size, size, seg, seg); geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position, cols = new Float32Array(pos.count * 3);
  const grassA = new THREE.Color("#5cbd48"), grassB = new THREE.Color("#8ed457"), grassC = new THREE.Color("#3f9f3f");
  const path = new THREE.Color("#e8c391"), sand = new THREE.Color("#f6d9a2"), wet = new THREE.Color("#7fcfc7"), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i), h = heightAt(x, z); pos.setY(i, h);
    const n = 0.5 + 0.5 * Math.sin(x * 0.21 + Math.cos(z * 0.17) * 2) * Math.cos(z * 0.13 - x * 0.05);
    c.copy(grassA).lerp(grassB, n * 0.8).lerp(grassC, smooth(0.5, 1, Math.sin(x * 0.05) * Math.cos(z * 0.07)) * 0.5);
    const pd = pathDist(x, z); c.lerp(path, 1 - smooth(1.2, 2.2, pd));
    const r = Math.hypot(x, z), R = islandRadius(Math.atan2(z, x));
    c.lerp(sand, smooth(R - 7, R - 4, r)); c.lerp(wet, smooth(R - 0.5, R + 3, r));
    const dp = Math.hypot(x - POND.x, z - POND.z); c.lerp(sand, 1 - smooth(POND.r - 0.5, POND.r + 1.2, dp));
    cols[i * 3] = c.r; cols[i * 3 + 1] = c.g; cols[i * 3 + 2] = c.b;
  }
  geo.setAttribute("color", new THREE.BufferAttribute(cols, 3));
  geo.computeVertexNormals();

  ground.receiveShadow = true; scene.add(ground);
  GROUND = ground;
  const sea = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), new THREE.MeshStandardMaterial({ color: "#3cc3e6", roughness: 0.25, metalness: 0.05 }));
  sea.rotation.x = -Math.PI / 2; sea.position.y = -0.55; sea.receiveShadow = true; scene.add(sea);

/* ---------- obstacles for simple walking collision ---------- */
const OBST_C = []; // {x,z,r}
const OBST_B = []; // {x0,x1,z0,z1}
function blockCircle(x, z, r) { OBST_C.push({ x, z, r }); }
function blockBox(x0, x1, z0, z1) { OBST_B.push({ x0, x1, z0, z1 }); }
blockCircle(POND.x, POND.z, POND.r - 0.6);
function resolveCollisions(p, rad) {
  for (const o of OBST_C) {
    const dx = p.x - o.x, dz = p.z - o.z, d = Math.hypot(dx, dz), m = o.r + rad;
    if (d < m && d > 1e-4) { p.x = o.x + dx / d * m; p.z = o.z + dz / d * m; }
  }
  for (const b of OBST_B) {
    if (p.x > b.x0 - rad && p.x < b.x1 + rad && p.z > b.z0 - rad && p.z < b.z1 + rad) {
      const l = p.x - (b.x0 - rad), r = (b.x1 + rad) - p.x, t = p.z - (b.z0 - rad), bt = (b.z1 + rad) - p.z;
      const m = Math.min(l, r, t, bt);
      if (m === l) p.x = b.x0 - rad; else if (m === r) p.x = b.x1 + rad; else if (m === t) p.z = b.z0 - rad; else p.z = b.z1 + rad;
    }
  }
  const d = Math.hypot(p.x, p.z);
  if (d > WALK_R) { p.x *= WALK_R / d; p.z *= WALK_R / d; }
}

/* ---------- trees (instanced) ---------- */
const TREES = [];
function buildTrees() {
  const keepOut = [[CASTLE.x, CASTLE.z, 22], [POND.x, POND.z, POND.r + 4], [SPOTS.cottage.x, SPOTS.cottage.z, 6], [SPOTS.garden.x, SPOTS.garden.z, 8],
    [SPOTS.spawn.x, SPOTS.spawn.z, 8], [SPOTS.dragon.x, SPOTS.dragon.z, 5], [SPOTS.appleTree.x, SPOTS.appleTree.z, 5], [SPOTS.unicorn.x, SPOTS.unicorn.z, 5],
    [SPOTS.kitten.x, SPOTS.kitten.z, 5], [SPOTS.bunny.x, SPOTS.bunny.z, 4], [SPOTS.mom.x, SPOTS.mom.z, 3],
    ...SPOTS.stars.map(s => [s.x, s.z, 3.5]), ...SPOTS.carrots.map(s => [s.x, s.z, 2.5]), ...SPOTS.lanterns.map(s => [s.x, s.z, 3]),
    ...[SPOTS.bunny, SPOTS.mom, SPOTS.kitten, SPOTS.dragon, SPOTS.appleTree, SPOTS.unicorn].map(s => [s.x, s.z + 6, 5.5])];
  let tries = 0;
  while (TREES.length < 64 && tries++ < 4000) {
    const a = rand() * TAU, r = Math.sqrt(rr(0.04, 1)) * 49, x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (r > islandRadius(a) - 5) continue;
    if (pathDist(x, z) < 3.2) continue;
    if (keepOut.some(([kx, kz, kr]) => Math.hypot(x - kx, z - kz) < kr)) continue;
    if (TREES.some(t => Math.hypot(t.x - x, t.z - z) < 4.2)) continue;
    TREES.push({ x, z, s: rr(0.85, 1.35), kind: rand() < 0.3 ? "pine" : "round", pink: rand() < 0.28 });
  }
  if (LOADED.tree) { TREES.forEach(t => blockCircle(t.x, t.z, 0.55 * t.s)); return; }
  const trunkGeo = new THREE.CylinderGeometry(0.22, 0.36, 1, 8); trunkGeo.translate(0, 0.5, 0);
  const blobGeo = new THREE.IcosahedronGeometry(1, 2);
  const pineGeo = new THREE.ConeGeometry(1, 1.7, 9);
  const nRound = TREES.filter(t => t.kind === "round").length, nPine = TREES.length - nRound;
  const trunks = new THREE.InstancedMesh(trunkGeo, mat("#a0704c", { roughness: 0.9 }), TREES.length);
  const blobs = new THREE.InstancedMesh(blobGeo, new THREE.MeshStandardMaterial({ roughness: 0.75 }), nRound * 3);
  const pines = new THREE.InstancedMesh(pineGeo, new THREE.MeshStandardMaterial({ roughness: 0.8 }), nPine * 3);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), v = new THREE.Vector3(), sc = new THREE.Vector3(), col = new THREE.Color();
  const greens = ["#59b65a", "#4caa63", "#79c75a", "#3f9b5c"], pinks = ["#ffb3d1", "#ff9cc4", "#ffc8de"];
  let bi = 0, pi = 0;
  TREES.forEach((t, i) => {
    const y = heightAt(t.x, t.z), s = t.s, h = t.kind === "pine" ? 1.6 * s : 2.2 * s;
    m.compose(v.set(t.x, y - 0.1, t.z), q.identity(), sc.set(s, h, s)); trunks.setMatrixAt(i, m);
    if (t.kind === "round") {
      const parts = [[0, 2.9, 0, 1.75], [0.95, 2.45, 0.4, 1.2], [-0.85, 2.55, -0.35, 1.25]];
      parts.forEach(([ox, oy, oz, r], k) => {
        m.compose(v.set(t.x + ox * s, y + oy * s, t.z + oz * s), q.identity(), sc.set(r * s, r * s * 0.92, r * s));
        blobs.setMatrixAt(bi, m); col.set(t.pink ? pinks[(i + k) % 3] : greens[(i + k) % 4]); blobs.setColorAt(bi++, col);
      });
    } else {
      for (let k = 0; k < 3; k++) {
        const r = (1.7 - k * 0.42) * s;
        m.compose(v.set(t.x, y + (1.9 + k * 1.05) * s, t.z), q.identity(), sc.set(r, r * 0.95, r));
        pines.setMatrixAt(pi, m); col.set(greens[(i + k + 1) % 4]).multiplyScalar(0.9); pines.setColorAt(pi++, col);
      }
    }
    blockCircle(t.x, t.z, 0.55 * s);
  });
  for (const im of [trunks, blobs, pines]) { im.castShadow = true; im.receiveShadow = true; scene.add(im); }
}

/* ---------- flowers, grass tufts, rocks (instanced) ---------- */
function buildFlowers() {
  const spots = [];
  for (let c = 0; c < 46; c++) {
    const a = rand() * TAU, r = Math.sqrt(rand()) * 44, cx = Math.cos(a) * r, cz = Math.sin(a) * r;
    if (Math.hypot(cx - CASTLE.x, cz - CASTLE.z) < 13 || Math.hypot(cx - POND.x, cz - POND.z) < POND.r + 1.5) continue;
    const n = 6 + Math.floor(rand() * 9), hue = Math.floor(rand() * 5);
    for (let k = 0; k < n; k++) {
      const x = cx + rr(-2.4, 2.4), z = cz + rr(-2.4, 2.4);
      if (pathDist(x, z) < 1.8 || Math.hypot(x, z) > islandRadius(Math.atan2(z, x)) - 6) continue;
      spots.push({ x, z, hue: rand() < 0.75 ? hue : Math.floor(rand() * 5) });
    }
  }
  const palette = ["#ff7eb6", "#ffffff", "#ffd84d", "#c59bff", "#ff9a7a"].map(h => new THREE.Color(h));
  const heads = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), new THREE.MeshStandardMaterial({ roughness: 0.6 }), spots.length);
  const centers = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 0), mat("#ffb000"), spots.length);
  const stems = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.03, 0.04, 1, 4), mat("#3f9b4f"), spots.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), v = new THREE.Vector3(), s = new THREE.Vector3();
  spots.forEach((f, i) => {
    const y = heightAt(f.x, f.z), hh = rr(0.35, 0.6);
    m.compose(v.set(f.x, y + hh / 2, f.z), q.identity(), s.set(1, hh, 1)); stems.setMatrixAt(i, m);
    m.compose(v.set(f.x, y + hh + 0.05, f.z), q.identity(), s.set(0.24, 0.12, 0.24)); heads.setMatrixAt(i, m); heads.setColorAt(i, palette[f.hue]);
    m.compose(v.set(f.x, y + hh + 0.13, f.z), q.identity(), s.set(0.08, 0.06, 0.08)); centers.setMatrixAt(i, m);
  });
  heads.castShadow = false; scene.add(heads, centers, stems);

  const tufts = new THREE.InstancedMesh(new THREE.ConeGeometry(0.1, 0.55, 4), mat("#4f9e45", { roughness: 1 }), IS_MOBILE ? 500 : 900);
  let n = 0;
  while (n < tufts.count) {
    const a = rand() * TAU, r = Math.sqrt(rand()) * 46, x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (pathDist(x, z) < 2 || Math.hypot(x - POND.x, z - POND.z) < POND.r + 0.5 || r > islandRadius(a) - 7) continue;
    if (x > CASTLE.x - 12 && x < CASTLE.x + 12 && z > CASTLE.z - 8 && z < CASTLE.z + 8) continue;
    q.setFromEuler(new THREE.Euler(rr(-0.3, 0.3), rand() * TAU, rr(-0.3, 0.3)));
    m.compose(v.set(x, heightAt(x, z) + 0.2, z), q, s.setScalar(rr(0.7, 1.3))); tufts.setMatrixAt(n++, m);
  }
  scene.add(tufts);

  const rocks = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1, 0), mat("#c9bfd6", { roughness: 0.9 }), 18);
  for (let i = 0; i < 18; i++) {
    let x, z, a, r;
    do { a = rand() * TAU; r = rr(10, 47); x = Math.cos(a) * r; z = Math.sin(a) * r; } while (pathDist(x, z) < 3 || Math.hypot(x - POND.x, z - POND.z) < POND.r + 2 || Math.hypot(x - CASTLE.x, z - CASTLE.z) < 16);
    const sc = rr(0.4, 1.1);
    q.setFromEuler(new THREE.Euler(rand(), rand() * TAU, rand()));
    m.compose(v.set(x, heightAt(x, z) + sc * 0.3, z), q, s.set(sc * 1.2, sc * 0.8, sc)); rocks.setMatrixAt(i, m);

/* ---------- clouds & butterflies ---------- */
function buildSkyLife() {
  const cg = new THREE.Group(); scene.add(cg); World.clouds = cg;

    for (let k = 0; k < 5; k++) mesh(G.sphereLo, cm, { x: (k - 2) * rr(2.4, 3.2), y: rr(-0.6, 1.2) + (k === 2 ? 1.4 : 0), z: rr(-1.5, 1.5), s: rr(3, 4.6) - Math.abs(k - 2) * 0.6, parent: g, cast: false });
    g.scale.setScalar(rr(0.9, 1.6)); cg.add(g);
  }
  const wingGeo = new THREE.CircleGeometry(0.32, 10); wingGeo.translate(0.3, 0, 0);
  const colors = ["#ff7eb6", "#ffd84d", "#9fd3ff", "#c59bff"];
  for (let i = 0; i < 9; i++) {

    const l = new THREE.Mesh(wingGeo, wm), r = new THREE.Mesh(wingGeo, wm); r.scale.x = -1;

    b.userData = { cx: Math.cos(a) * rad, cz: Math.sin(a) * rad, r: rr(2, 5), sp: rr(0.25, 0.5) * (rand() < 0.5 ? -1 : 1), ph: rand() * TAU, wl, wr };
    scene.add(b); World.butterflies.push(b);
  }
}

World.update = function (t, dt) {
  World.clouds.rotation.y = t * 0.004;
  for (const f of World.flags) f.rotation.y = Math.sin(t * 2.2 + f.position.x) * 0.35;
  for (const b of World.butterflies) {
    const u = b.userData, a = t * u.sp + u.ph;
    const x = u.cx + Math.cos(a) * u.r, z = u.cz + Math.sin(a * 1.3) * u.r;
    b.position.set(x, heightAt(x, z) + 1.7 + Math.sin(t * 2 + u.ph) * 0.4, z); b.scale.setScalar(0.6);
    b.rotation.y = Math.atan2(-Math.sin(a) * u.sp, Math.cos(a * 1.3) * 1.3 * u.sp) + Math.PI / 2;
    const flap = Math.sin(t * 18 + u.ph) * 0.9;
    u.wl.rotation.z = flap; u.wr.rotation.z = -flap;
  }
  if (World.water) World.water.material.color.setHSL(0.54, 0.85, 0.66 + Math.sin(t * 0.8) * 0.02);
};

/* ================= PRINCESS LUNA (matches her picture: curly brown hair, pink + lavender gown, heart tiara) ================= */

  // glitter on the gown
  const gl = [], N = 150;

  const gg = new THREE.BufferGeometry(); gg.setAttribute("position", new THREE.Float32BufferAttribute(gl, 3));

  mesh(new THREE.CylinderGeometry(0.25, 0.3, 0.44, 24), bodiceM, { y: 1.24, parent: body });
  mesh(new THREE.TorusGeometry(0.3, 0.05, 8, 28), mat("#f37fb1", { roughness: 0.3 }), { y: 1.04, rx: Math.PI / 2, parent: body, cast: false });
  for (const s of [-1, 1]) {

  mesh(G.sphereLo, mat("#ff5fa2", { roughness: 0.2, metalness: 0.2, emissive: new THREE.Color("#ff2a7a"), emissiveIntensity: 0.3 }), { y: 1.36, z: 0.26, s: 0.045, parent: body, cast: false });
  mesh(new THREE.TorusGeometry(0.255, 0.012, 6, 24, Math.PI), gold, { y: 1.42, z: 0.0, rx: -Math.PI / 2 + 0.25, rz: Math.PI, parent: body, cast: false });

  // arms with puffy see-through sleeves
  const arms = [];

    const pivot = new THREE.Group(); pivot.position.set(s * 0.3, 1.4, 0); body.add(pivot);
    mesh(G.sphere, sleeveM, { s: 0.17, parent: pivot, cast: false });
    mesh(G.cap, skin, { y: -0.27, sx: 0.065, sy: 0.19, sz: 0.065, parent: pivot });

    arms.push(pivot);
  }
  mesh(G.cyl, skin, { y: 1.5, sx: 0.08, sy: 0.16, sz: 0.08, parent: body });

  // head
  const head = new THREE.Group(); head.position.y = 1.9; body.add(head);
  mesh(G.sphere, skin, { sx: 0.42, sy: 0.41, sz: 0.4, parent: head });
  for (const s of [-1, 1]) mesh(G.sphereLo, skin, { x: s * 0.4, y: -0.03, s: 0.07, parent: head, cast: false });
  const eyes = [];
  const white = mat("#ffffff", { roughness: 0.2 }), iris = mat("#5a3218", { roughness: 0.15 }), pupil = mat("#160a05", { roughness: 0.1 });
  const shine = new THREE.MeshBasicMaterial({ color: "#ffffff" });
  for (const s of [-1, 1]) {
    const e = new THREE.Group(); e.position.set(s * 0.15, 0.0, 0.345); e.rotation.y = s * 0.28; head.add(e);
    mesh(G.sphere, white, { sx: 0.1, sy: 0.115, sz: 0.06, parent: e, cast: false });
    mesh(G.sphere, iris, { z: 0.025, sx: 0.08, sy: 0.095, sz: 0.05, parent: e, cast: false });
    mesh(G.sphere, pupil, { z: 0.045, sx: 0.043, sy: 0.052, sz: 0.035, parent: e, cast: false });
    mesh(G.sphereLo, shine, { x: 0.025, y: 0.035, z: 0.075, s: 0.022, parent: e, cast: false });
    mesh(G.cap, mat("#2a160c"), { y: 0.11, z: 0.02, sx: 0.016, sy: 0.07, sz: 0.016, rz: Math.PI / 2 + s * 0.12, parent: e, cast: false });
    mesh(G.cap, mat("#3a2216"), { y: 0.21, z: 0.0, sx: 0.014, sy: 0.05, sz: 0.014, rz: Math.PI / 2 + s * 0.18, parent: e, cast: false });
    eyes.push(e);
    mesh(G.sphereLo, new THREE.MeshStandardMaterial({ color: "#ff8fa6", transparent: true, opacity: 0.45, roughness: 1 }), { x: s * 0.24, y: -0.11, z: 0.31, sx: 0.08, sy: 0.05, sz: 0.04, parent: head, cast: false });
  }
  mesh(G.sphereLo, mat("#e6a07f"), { y: -0.06, z: 0.405, s: 0.033, parent: head, cast: false });
  const mouth = new THREE.Group(); mouth.position.set(0, -0.165, 0.375); mouth.rotation.x = -0.35; head.add(mouth);
  mesh(new THREE.CircleGeometry(0.085, 24, Math.PI, Math.PI), new THREE.MeshStandardMaterial({ color: "#b8304f", roughness: 0.6, side: THREE.DoubleSide }), { parent: mouth, cast: false });
  mesh(G.box, mat("#ffffff"), { y: -0.012, z: 0.002, sx: 0.13, sy: 0.022, sz: 0.004, parent: mouth, cast: false });

  // curly hair: a cloud of bumpy curls around the back and sides, falling to the shoulders
  const curlPos = [];
  for (let i = 0; i < 260 && curlPos.length < 92; i++) {
    const u = rand() * TAU, v = Math.acos(rr(-0.35, 1));
    const d = new THREE.Vector3(Math.sin(v) * Math.cos(u), Math.cos(v), Math.sin(v) * Math.sin(u));
    if (d.z > 0.35 && d.y < 0.55) continue;           // keep the face clear
    curlPos.push(d.multiplyScalar(0.43 + rr(0, 0.05)));
  }
  for (let i = 0; i < 46; i++) {                       // long curly sides and back
    const s = i % 2 ? 1 : -1, y = rr(-0.62, 0.05), back = rand() < 0.4;
    curlPos.push(new THREE.Vector3(back ? rr(-0.35, 0.35) : s * rr(0.36, 0.56), y, back ? rr(-0.45, -0.3) : rr(-0.3, 0.12)));
  }
  for (let i = 0; i < 9; i++) curlPos.push(new THREE.Vector3(rr(-0.3, 0.3), rr(0.26, 0.34), 0.3 - Math.abs(i - 4) * 0.012)); // bangs
  const curls = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), new THREE.MeshStandardMaterial({ roughness: 0.5 }), curlPos.length);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sv = new THREE.Vector3(), c1 = new THREE.Color(HAIR), c2 = new THREE.Color(HAIR2);
  curlPos.forEach((p, i) => {
    q.setFromEuler(new THREE.Euler(rand() * 3, rand() * 3, rand() * 3));
    m4.compose(p, q, sv.setScalar(rr(0.1, 0.15))); curls.setMatrixAt(i, m4); curls.setColorAt(i, rand() < 0.3 ? c2 : c1);
  });
  curls.castShadow = true; head.add(curls);

  // heart tiara
  const tiara = new THREE.Group(); tiara.position.set(0, 0.34, 0.06); tiara.rotation.x = -0.32; head.add(tiara);
  mesh(new THREE.TorusGeometry(0.31, 0.022, 8, 32, Math.PI), gold, { rx: Math.PI / 2, rz: Math.PI, parent: tiara, cast: false });
  const gemPink = mat("#ff6fae", { roughness: 0.15, metalness: 0.1, emissive: new THREE.Color("#ff3d8b"), emissiveIntensity: 0.45 });
  [[0, 0.12, 0.075], [-0.15, 0.07, 0.05], [0.15, 0.07, 0.05]].forEach(([x, y, s]) => {
    const a = Math.asin(x / 0.31), hz = Math.cos(a) * 0.31;
    const heart = new THREE.Group(); heart.position.set(x, y * 0.6, hz); tiara.add(heart);
    mesh(new THREE.TorusGeometry(s * 1.1, s * 0.22, 6, 18), gold, { y: s * 0.2, parent: heart, cast: false });
    mesh(G.sphereLo, gemPink, { x: -s * 0.38, y: s * 0.35, s: s * 0.55, parent: heart, cast: false });
    mesh(G.sphereLo, gemPink, { x: s * 0.38, y: s * 0.35, s: s * 0.55, parent: heart, cast: false });
    mesh(G.coneLo, gemPink, { y: -s * 0.25, sx: s * 0.75, sy: s * 0.9, sz: s * 0.45, rz: Math.PI, parent: heart, cast: false });
  });

  // pink party shoes
  const shoes = [];
  for (const s of [-1, 1]) shoes.push(mesh(G.sphere, mat("#f58fc0", { roughness: 0.25, metalness: 0.1 }), { x: s * 0.14, y: 0.06, z: 0.12, sx: 0.1, sy: 0.07, sz: 0.16, parent: body }));

  const P = { root, body, head, arms, eyes, shoes, glitter, phase: 0, blinkAt: 2, celebrate: 0, twirl: 0, airborne: false };
  P.update = function (dt, t, moveFrac) {
    P.phase += dt * 11 * moveFrac;
    const walk = moveFrac > 0.05, ph = P.phase;
    body.position.y = walk ? Math.abs(Math.sin(ph)) * 0.08 : Math.sin(t * 2.1) * 0.01;
    body.rotation.x = lerp(body.rotation.x, walk ? 0.08 : 0, 1 - Math.exp(-dt * 8));
    body.rotation.z = walk ? Math.sin(ph) * 0.035 : Math.sin(t * 0.9) * 0.015;
    head.rotation.z = walk ? Math.sin(ph) * 0.05 : Math.sin(t * 0.7) * 0.06;
    head.rotation.y = walk ? 0 : Math.sin(t * 0.45) * 0.18;
    const up = P.celebrate > 0 || P.airborne;
    arms.forEach((a, i) => {
      const s = i ? 1 : -1;
      const tz = up ? s * 2.55 + Math.sin(t * 9 + i) * 0.12 : s * 0.22;
      const tx = up ? 0 : (walk ? Math.sin(ph + i * Math.PI) * 0.55 : Math.sin(t * 1.3 + i) * 0.05);
      a.rotation.z = lerp(a.rotation.z, tz, 1 - Math.exp(-dt * 12));
      a.rotation.x = lerp(a.rotation.x, tx, 1 - Math.exp(-dt * 12));
    });
    shoes.forEach((sh, i) => { const k = Math.sin(ph + i * Math.PI); sh.position.z = 0.12 + (walk ? k * 0.12 : 0); sh.position.y = 0.06 + (walk ? Math.max(0, k) * 0.05 : 0); });
    if (P.celebrate > 0) { P.celebrate -= dt; body.position.y += Math.abs(Math.sin(t * 10)) * 0.18; }
    if (P.twirl > 0) { P.twirl = Math.max(0, P.twirl - dt); body.rotation.y = (1 - P.twirl / 0.9) * TAU; } else body.rotation.y = 0;
    // blink
    P.blinkAt -= dt;
    const closing = P.blinkAt < 0.12 && P.blinkAt > 0;
    eyes.forEach(e => e.scale.y = closing ? 0.12 : 1);
    if (P.blinkAt <= 0) P.blinkAt = rr(2.2, 5);
    glitter.material.opacity = 0.65 + Math.sin(t * 5) * 0.35;
  };
  root.traverse(o => { if (o.isMesh && o.castShadow === undefined) o.castShadow = true; });
  return P;
}

/* ================= FRIENDS: Bun-Bun, Mimi + Pip, Dot the dragon, Stardust the unicorn ================= */
function eyePair(parent, y, z, gap, s, irisColor) {
  const out = [];
  for (const k of [-1, 1]) {
    const e = new THREE.Group(); e.position.set(k * gap, y, z); parent.add(e);
    mesh(G.sphere, mat(irisColor || "#1b1020", { roughness: 0.1 }), { sx: s, sy: s * 1.15, sz: s * 0.6, parent: e, cast: false });
    if (irisColor) mesh(G.sphere, mat("#120a10", { roughness: 0.1 }), { z: s * 0.35, sx: s * 0.5, sy: s * 0.7, sz: s * 0.3, parent: e, cast: false });
    mesh(G.sphereLo, new THREE.MeshBasicMaterial({ color: "#ffffff" }), { x: s * 0.3, y: s * 0.4, z: s * 0.5, s: s * 0.3, parent: e, cast: false });
    out.push(e);
  }
  return out;
}
function blinker(eyes) { let at = rr(1, 4); return dt => { at -= dt; eyes.forEach(e => e.scale.y = at < 0.12 && at > 0 ? 0.15 : 1); if (at <= 0) at = rr(2, 5); }; }

function makeBunny() {

  const ears = [];
  for (const k of [-1, 1]) {

    mesh(G.cap, pink, { y: 0.32, z: 0.035, sx: 0.05, sy: 0.2, sz: 0.03, parent: ear, cast: false });

  mesh(G.sphereLo, pink, { y: -0.05, z: 0.36, sx: 0.05, sy: 0.035, sz: 0.03, parent: head, cast: false });

  const blink = blinker(eyes);
  return { root, body: b, name: "Bun-Bun", hop: 0, update(dt, t) { blink(dt); ears.forEach((e, i) => e.rotation.x = Math.sin(t * 3 + i) * 0.12); b.position.y = Math.abs(Math.sin(t * 2.2)) < 0.15 ? 0 : 0; } };

/* turn a friend to face a point smoothly */
function faceToward(obj, x, z, dt, speed = 6) {
  const want = Math.atan2(x - obj.position.x, z - obj.position.z);
  let d = want - obj.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d));
  obj.rotation.y += d * (1 - Math.exp(-dt * speed));
}

/* the real box of a model; for a model with a skeleton the vertices are moved by the bones first */
function modelBox(obj) {
  obj.updateMatrixWorld(true);
  const box = new THREE.Box3(), v = new THREE.Vector3();
  let skinned = false;
  obj.traverse(o => {
    if (!o.isSkinnedMesh) return;
    skinned = true; o.skeleton.update();
    const pos = o.geometry.attributes.position, step = Math.max(1, Math.floor(pos.count / 6000));
    for (let i = 0; i < pos.count; i += step) { v.fromBufferAttribute(pos, i); o.boneTransform(i, v); v.applyMatrix4(o.matrixWorld); box.expandByPoint(v); }
  });
  return skinned ? box : box.setFromObject(obj);
}
/* scale a model to a height, stand it on y=0 and centre it */
function fitModel(obj, height) {
  let box = modelBox(obj); const h = Math.max(1e-3, box.max.y - box.min.y);
  obj.scale.multiplyScalar(height / h);
  box = modelBox(obj);
  const c = box.getCenter(new THREE.Vector3());
  obj.position.x -= c.x; obj.position.z -= c.z; obj.position.y -= box.min.y;
  return box;
}
function prepModel(obj, opts = {}) {
  obj.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = opts.cast !== false; o.receiveShadow = !!opts.receive;
    o.frustumCulled = !o.isSkinnedMesh;
    const ms = Array.isArray(o.material) ? o.material : [o.material];
    ms.forEach(m => {
      if (!m) return;
      if (m.map) m.map.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
      if ("roughness" in m) { m.roughness = opts.rough ?? 0.62; m.metalness = 0; }
      m.envMapIntensity = opts.env ?? 0.9;
    });
  });
}

/* Luna: the rigged model with her moves (walk, skip, run, idle, sway, jump, happy jump, wave, cheer, dance) */
function makeLunaFromGLB(gltf) {
  const root = new THREE.Group(), inner = new THREE.Group(); root.add(inner);
  const model = gltf.scene; inner.add(model);
  fitModel(model, 1.85); prepModel(model, { rough: 0.55 });
  const mixer = new THREE.AnimationMixer(model), actions = {};
  for (const clip of gltf.animations) {
    // keep her in place: the game moves her, so the hips may only move up and down
    for (const tr of clip.tracks) {
      if (/(hips|root)[^.]*\.position$/i.test(tr.name)) {
        const v = tr.values, x0 = v[0], z0 = v[2];
        for (let i = 0; i < v.length; i += 3) { v[i] = x0; v[i + 2] = z0; }
      }
    }
    actions[clip.name] = mixer.clipAction(clip);
  }
  const ONCE = { jump: 1, happyjump: 1, wave: 1, cheer: 1 };
  let cur = null, busy = 0;
  function play(name, fade = 0.25) {
    const a = actions[name]; if (!a || cur === a) return !!a;
    a.reset(); a.enabled = true; a.setEffectiveWeight(1);
    if (ONCE[name]) { a.setLoop(THREE.LoopOnce, 1); a.clampWhenFinished = true; } else a.setLoop(THREE.LoopRepeat, Infinity);
    a.timeScale = 1;
    if (cur) cur.crossFadeTo(a, fade, false); a.play(); cur = a; return true;
  }
  const L = {
    root, glb: true, celebrate: 0, twirl: 0, airborne: false,
    has: n => !!actions[n],
    act(name, secs) { if (play(name, 0.2)) busy = secs || (actions[name].getClip().duration * 0.95); },
    update(dt, t, moveFrac) {
      if (L.twirl > 0) { L.twirl = Math.max(0, L.twirl - dt); inner.rotation.y = (1 - L.twirl / 0.9) * TAU; } else inner.rotation.y = 0;
      if (busy > 0) busy -= dt;
      else if (L.airborne) play(actions.jump ? "jump" : "idle", 0.12);
      else if (L.celebrate > 0) { L.celebrate -= dt; play(actions.cheer ? "cheer" : (actions.happyjump ? "happyjump" : "idle"), 0.2); }
      else if (L.dancing) play(actions.dance ? "dance" : "idle", 0.3);
      else if (moveFrac > 0.75 && actions.run) { play("run"); cur.timeScale = 0.9 + moveFrac * 0.25; }
      else if (moveFrac > 0.05) { play(actions.skip && L.skippy ? "skip" : "walk"); cur.timeScale = 0.75 + moveFrac * 0.45; }
      else play(actions.sway && (Math.floor(t / 9) % 3 === 2) ? "sway" : "idle", 0.4);
      mixer.update(dt);
    },
  };
  play("idle", 0);
  return L;
}

function makePuppet(gltf, height, name) {

    if (P.chomp > 0) { P.chomp -= dt; body.rotation.x = Math.abs(Math.sin(P.chomp * 14)) * 0.12; } else body.rotation.x = 0;
    body.position.y = y;

}

/* ================= ITEMS & EFFECTS: carrots, apples, stars, lanterns, beacon, sparkles, fireworks ================= */
class Sparkles {
  constructor(count, size, gravity) {
    this.n = count; this.g = gravity; this.i = 0;
    this.pos = new Float32Array(count * 3); this.col = new Float32Array(count * 3);
    this.vel = new Float32Array(count * 3); this.life = new Float32Array(count); this.max = new Float32Array(count); this.base = new Float32Array(count * 3);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(this.pos, 3)); geo.setAttribute("color", new THREE.BufferAttribute(this.col, 3));
    this.points = new THREE.Points(geo, new THREE.PointsMaterial({ map: sparkTex, size, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
    this.points.frustumCulled = false; scene.add(this.points);
  }
  burst(p, count, colors, speed = 4, life = 1, up = 2) {
    const c = new THREE.Color();
    for (let k = 0; k < count; k++) {
      const i = this.i = (this.i + 1) % this.n, a = rand() * TAU, e = rr(-0.3, 1);
      const sp = speed * rr(0.4, 1);
      this.pos.set([p.x, p.y, p.z], i * 3);
      this.vel.set([Math.cos(a) * Math.cos(e) * sp, Math.sin(e) * sp + up, Math.sin(a) * Math.cos(e) * sp], i * 3);
      c.set(colors[k % colors.length]); this.base.set([c.r, c.g, c.b], i * 3);
      this.life[i] = this.max[i] = life * rr(0.6, 1.2);
    }
  }
  update(dt) {
    for (let i = 0; i < this.n; i++) {
      if (this.life[i] <= 0) { this.col[i * 3] = this.col[i * 3 + 1] = this.col[i * 3 + 2] = 0; continue; }
      this.life[i] -= dt;
      const k = Math.max(0, this.life[i] / this.max[i]), j = i * 3;
      this.vel[j + 1] -= this.g * dt;
      this.vel[j] *= 0.985; this.vel[j + 2] *= 0.985;
      this.pos[j] += this.vel[j] * dt; this.pos[j + 1] += this.vel[j + 1] * dt; this.pos[j + 2] += this.vel[j + 2] * dt;
      const tw = 0.75 + 0.25 * Math.sin(i * 7.3 + this.life[i] * 30);
      this.col[j] = this.base[j] * k * tw; this.col[j + 1] = this.base[j + 1] * k * tw; this.col[j + 2] = this.base[j + 2] * k * tw;
    }
    this.points.geometry.attributes.position.needsUpdate = true; this.points.geometry.attributes.color.needsUpdate = true;
  }
}

const Voice = (() => {
  const synth = window.speechSynthesis;
  let voice = null, last = "", timer = null;
  const PREF = ["Samantha", "Ava", "Allison", "Karen", "Serena", "Moira", "Tessa", "Victoria", "Google US English", "Google UK English Female", "Microsoft Aria", "Microsoft Jenny", "Microsoft Zira"];
  function pick() {
    if (!synth) return null;
    const vs = synth.getVoices().filter(v => /^en(-|_|$)/i.test(v.lang));
    // like Block Buddies: the most natural voice the tablet has (Enhanced or Premium ones first)
    const score = v => (/premium|enhanced|neural|natural/i.test(v.name + " " + v.voiceURI) ? 10 : 0) + (PREF.findIndex(p => v.name.indexOf(p) >= 0) >= 0 ? 6 - PREF.findIndex(p => v.name.indexOf(p) >= 0) * 0.2 : 0) + (/en-US|en-GB/i.test(v.lang) ? 1 : 0) + (v.localService ? 0.5 : 0);
    return vs.slice().sort((a, b) => score(b) - score(a))[0] || null;
  }
  if (synth) { voice = pick(); if ("onvoiceschanged" in synth) synth.onvoiceschanged = () => { voice = pick(); }; }
  function say(text) {
    last = text; if (!synth) return;
    clearTimeout(timer);
    const go = () => {
      const u = new SpeechSynthesisUtterance(text);
      if (voice) u.voice = voice; u.lang = voice ? voice.lang : "en-US";
      u.rate = 0.92; u.pitch = 1.15;
      u.onstart = () => Sound.duck(true); u.onend = u.onerror = () => Sound.duck(false);
      synth.speak(u);
    };
    if (synth.speaking || synth.pending) { synth.cancel(); timer = setTimeout(go, 80); } else go();
  }
  return { say, repeat() { if (last) say(last); }, stop() { if (synth) synth.cancel(); }, get available() { return !!synth; } };
})();

const SPEED = 6.4;
function updatePlayer(dt, t) {

/* ---------- finding the way: a sparkly trail on the ground and a golden arrow at Luna's feet ---------- */
const Trail = (() => {
  const N = 26, pos = new Float32Array(N * 3), col = new Float32Array(N);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3)); geo.setAttribute("alpha", new THREE.BufferAttribute(col, 1));
  // golden sparkles that show on bright grass too (normal blending, each with its own fade)
  const TRAIL_U = { map: { value: sparkTex }, color: { value: new THREE.Color("#ffb300") }, scale: { value: 400 } };
  const dots = new THREE.Points(geo, new THREE.ShaderMaterial({ uniforms: TRAIL_U, transparent: true, depthWrite: false,
    vertexShader: "attribute float alpha; varying float vA; uniform float scale; void main(){ vA = alpha; vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_PointSize = 0.95 * scale / -mv.z; gl_Position = projectionMatrix * mv; }",
    fragmentShader: "uniform sampler2D map; uniform vec3 color; varying float vA; void main(){ vec4 t = texture2D(map, gl_PointCoord); float a = t.a * vA; if (a < 0.02) discard; gl_FragColor = vec4(mix(color, vec3(1.0, 0.97, 0.85), t.r * 0.6), a); }" }));
  dots.frustumCulled = false; scene.add(dots);
  const shape = new THREE.Shape();
  shape.moveTo(0, 0.75); shape.lineTo(0.55, 0.05); shape.lineTo(0.2, 0.05); shape.lineTo(0.2, -0.6); shape.lineTo(-0.2, -0.6); shape.lineTo(-0.2, 0.05); shape.lineTo(-0.55, 0.05); shape.closePath();
  const arrowGeo = new THREE.ShapeGeometry(shape); arrowGeo.rotateX(-Math.PI / 2); arrowGeo.rotateY(Math.PI);
  const arrow = new THREE.Mesh(arrowGeo, new THREE.MeshBasicMaterial({ color: "#ffd23f", transparent: true, opacity: 0.9, depthWrite: false }));
  arrow.renderOrder = 2; scene.add(arrow);
  const gold = new THREE.Color("#ffd86b");
  return {
    update(t) {
      const show = Game.mode === "play" && !Game.dialog && Beacon.visible && Beacon.target;
      const tg = Beacon.target, dx = show ? tg.x - player.pos.x : 0, dz = show ? tg.z - player.pos.z : 0, d = Math.hypot(dx, dz);
      const on = show && d > 4;
      dots.visible = arrow.visible = on;
      if (!on) return;
      const ux = dx / d, uz = dz / d, gap = 1.5, flow = (t * 2.2) % gap;
      for (let i = 0; i < N; i++) {
        const s = 2.2 + i * gap + flow, j = i * 3;

        const x = player.pos.x + ux * s, z = player.pos.z + uz * s;
        pos[j] = x; pos[j + 1] = heightAt(x, z) + 0.25; pos[j + 2] = z;
        const fade = Math.min(1, (s - 2) / 2) * Math.min(1, (d - 1.2 - s) / 2) * (0.7 + 0.3 * Math.sin(t * 6 + i));
        col[i] = Math.max(0, fade);
      }

      geo.attributes.position.needsUpdate = true; geo.attributes.alpha.needsUpdate = true;
      const ax = player.pos.x + ux * 1.35, az = player.pos.z + uz * 1.35;
      arrow.position.set(ax, heightAt(ax, az) + 0.08, az); arrow.rotation.y = Math.atan2(ux, uz);
      arrow.scale.setScalar(1 + Math.sin(t * 5) * 0.08);
    },
  };
})();

const Quality = { pr: renderer.getPixelRatio(), max: renderer.getPixelRatio(), avg: 1 / 60, clock: 0 };

  }
  tappables.push({ pos: () => new THREE.Vector3(SPOTS.appleTree.x, heightAt(SPOTS.appleTree.x, SPOTS.appleTree.z) + 3.6, SPOTS.appleTree.z), r: 3.2,
    tap: () => walkTo(SPOTS.appleTree.x, SPOTS.appleTree.z, 4.0, treeArrive) });
  lanterns.forEach((L, i) => tappables.push({ pos: () => L.root.position.clone().setY(L.root.position.y + 2), r: 1.3, tap: () => walkTo(L.root.position.x, L.root.position.z, 2.1, () => lanternArrive(i)) }));
  tappables.push({ pos: () => new THREE.Vector3(player.pos.x, player.y + 1, player.pos.z), r: 0.95, tap: twirl });
  player.pos.set(SPOTS.spawn.x, 0, SPOTS.spawn.z); player.heading = 0;
  const saved = loadStage();
  if (saved > 0 && saved < 5) { $("btnNew").hidden = false; $("btnPlay").textContent = "Continue"; }
  $("loading").hidden = true;
  window.__ready = true;
  requestAnimationFrame(loop);
}
boot();

</script>

</html>
