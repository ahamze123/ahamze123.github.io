<html lang="en">
<head>

<meta name="description" content="Flop Island: wobbly fuzzy animals, a sunny island full of jobs and missions, and big floppy brawls. Play online with friends, each on their own tablet.">
<meta name="theme-color" content="#8fd3ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flop Island">

<style>[hidden]{display:none!important}html,body{margin:0;height:100%}</style>
<script>/* no pinch-zoom on iPad: the game uses two fingers itself */document.addEventListener('gesturestart',function(e){e.preventDefault();},{passive:false});</script>
<title>Flop Island</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titan+One&family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: full-bleed 3D toy island; sticker-style HUD chips pinned to corners; menus are chunky toy-box cards over the live scene.
   Single deliberate look (bright toy world), so no dark variant. */
:root {
  --ink: #2b1b3f;        /* outlines + text */
  --paper: #fff7e8;      /* card + chip fill */
  --sun: #ffc93c;        /* primary buttons, coins */
  --bubble: #ff5e8a;     /* accent, brawl */
  --sea: #2ec4d6;        /* secondary, focus */
  --leaf: #7bd84b;       /* success */
  --sky: #8fd3ff;        /* page ground behind canvas */
  --muted: #6b5a80;      /* secondary text */
  --veil: rgba(43, 27, 63, 0.42);
  --font-display: "Titan One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Baloo 2", "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: var(--sky); color: var(--ink); font-family: var(--font-body); overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
#vignette { position: fixed; inset: 0; pointer-events: none; z-index: 5; background: radial-gradient(ellipse at 50% 45%, rgba(43, 27, 63, 0) 58%, rgba(43, 27, 63, 0.22) 100%); }
button { font: inherit; color: inherit; }
.screen { position: fixed; inset: 0; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px)); background: var(--veil); z-index: 20; overflow: auto; }
.screen.clear { background: transparent; pointer-events: none; }
.screen.clear > * { pointer-events: auto; }
.card { background: var(--paper); border: 4px solid var(--ink); border-radius: 28px; box-shadow: 0 8px 0 var(--ink); padding: 22px 24px; width: min(760px, 100%); max-height: calc(100% - 8px); overflow: auto; box-sizing: border-box; }
.card h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 4vw, 36px); margin: 0 0 4px; letter-spacing: 0.5px; text-wrap: balance; }
.card p.lead { margin: 0 0 16px; color: var(--muted); font-size: 17px; line-height: 1.35; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.stack { display: grid; gap: 12px; }
.btn { font-family: var(--font-display); font-size: 21px; letter-spacing: 0.4px; padding: 12px 22px; border: 4px solid var(--ink); border-radius: 18px; background: var(--sun); box-shadow: 0 6px 0 var(--ink); cursor: pointer; transition: transform 0.08s, box-shadow 0.08s, filter 0.1s; min-height: 54px; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--ink); filter: saturate(1.15); }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.btn:focus-visible, .pick:focus-visible, .swatch:focus-visible, .seg button:focus-visible, .icon-btn:focus-visible, .tb:focus-visible { outline: 4px solid var(--sea); outline-offset: 3px; }
.btn.pink { background: var(--bubble); color: #fff; }
.btn.teal { background: var(--sea); }
.btn.leaf { background: var(--leaf); }
.btn.ghost { background: var(--paper); }
.btn.small { font-size: 17px; padding: 8px 14px; min-height: 44px; border-radius: 14px; box-shadow: 0 4px 0 var(--ink); }
.btn[disabled] { filter: grayscale(0.8); opacity: 0.6; cursor: default; transform: none; }
/* title */
#title { background: linear-gradient(180deg, rgba(43,27,63,0.18) 0%, rgba(43,27,63,0) 30%, rgba(43,27,63,0) 52%, rgba(43,27,63,0.5) 100%); place-items: stretch; padding-bottom: max(22px, env(safe-area-inset-bottom, 0px)); }
.title-wrap { display: grid; grid-template-rows: auto 1fr auto; gap: 14px; justify-items: center; width: min(900px, 100%); min-height: 100%; margin: 0 auto; }
.title-top { display: grid; gap: 12px; justify-items: center; }
.title-bottom { display: grid; gap: 14px; justify-items: center; width: 100%; }
.logo { font-family: var(--font-display); font-size: clamp(50px, 11vw, 116px); line-height: 0.9; margin: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 0 0.18em; text-align: center; }
.logo .w { display: inline-flex; }
.logo span.l { display: inline-block; color: var(--sun); -webkit-text-stroke: 0.09em var(--ink); paint-order: stroke fill; text-shadow: 0 0.08em 0 var(--ink); animation: wob 2.6s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes wob { 0%, 100% { transform: rotate(-4deg) scale(1, 1); } 30% { transform: rotate(3deg) scale(1.06, 0.94); } 60% { transform: rotate(-2deg) scale(0.96, 1.05); } }
.tagline { font-family: var(--font-display); font-size: clamp(17px, 2.6vw, 24px); background: var(--paper); border: 4px solid var(--ink); border-radius: 999px; padding: 6px 18px; box-shadow: 0 5px 0 var(--ink); margin: 0; text-align: center; }
.menu-btns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; width: min(620px, 100%); }
.menu-btns .btn { width: 100%; }
.menu-btns .btn.big { grid-column: span 2; font-size: 28px; min-height: 68px; }
.title-foot { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
/* chips */
.chip { display: inline-flex; align-items: center; gap: 8px; background: var(--paper); border: 3px solid var(--ink); border-radius: 999px; padding: 4px 14px 4px 5px; font-family: var(--font-display); font-size: 20px; box-shadow: 0 4px 0 var(--ink); font-variant-numeric: tabular-nums; }
.chip .ico { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--ink); display: grid; place-items: center; font-size: 15px; box-sizing: border-box; }
.ico.coin { background: var(--sun); }
.ico.duck { background: #ffe066; }
.ico.duck::before, .ico.coin::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); opacity: 0.85; }
.ico.coin::before { width: 8px; height: 14px; border-radius: 4px; background: #e8a400; opacity: 1; border: 2px solid var(--ink); }
.ico.duck::before { width: 14px; height: 9px; border-radius: 60% 40% 40% 60%; background: #ff9320; border: 2px solid var(--ink); }
/* HUD */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#hud .tl { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
#hud .tr { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 14px; display: flex; gap: 10px; pointer-events: auto; }
.icon-btn { width: 50px; height: 50px; border-radius: 16px; border: 3px solid var(--ink); background: var(--paper); box-shadow: 0 4px 0 var(--ink); font-family: var(--font-display); font-size: 20px; cursor: pointer; display: grid; place-items: center; }
.icon-btn .bars { display: flex; gap: 5px; } .icon-btn .bars i { width: 6px; height: 18px; background: var(--ink); border-radius: 3px; }
#job { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 50%; transform: translateX(-50%); background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 4px 0 var(--ink); padding: 8px 16px; text-align: center; min-width: 220px; max-width: calc(100% - 260px); }
#job .jt { font-family: var(--font-display); font-size: 18px; }
#job .jd { font-size: 16px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
#job .bar { height: 8px; border-radius: 4px; background: #eadfcd; margin-top: 4px; overflow: hidden; } #job .bar i { display: block; height: 100%; background: var(--leaf); }
#mission { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 50%; transform: translateX(-50%); background: #fff3c4; border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 4px 0 var(--ink); padding: 7px 16px 8px; text-align: center; min-width: 240px; max-width: calc(100% - 380px); box-sizing: border-box; }
#mission .mt { font-family: var(--font-display); font-size: 18px; }
#mission .md { font-size: 16px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
#mission .msteps { display: flex; gap: 6px; justify-content: center; margin-top: 4px; }
#mission .msteps i { width: 22px; height: 7px; border-radius: 4px; background: #eadfcd; }
#mission .msteps i.on { background: var(--leaf); } #mission .msteps i.now { background: var(--sun); }
#hud.has-mission #job { top: calc(env(safe-area-inset-top, 0px) + 94px); }
#hud.has-mission #toasts, #hud.has-job #toasts { top: calc(env(safe-area-inset-top, 0px) + 104px); }
#hud.has-mission.has-job #toasts { top: calc(env(safe-area-inset-top, 0px) + 186px); }
#prompt { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 26px); transform: translateX(-50%); display: flex; align-items: center; gap: 10px; background: var(--paper); border: 3px solid var(--ink); border-radius: 999px; padding: 6px 18px 6px 6px; box-shadow: 0 4px 0 var(--ink); font-family: var(--font-display); font-size: 20px; white-space: nowrap; }
.key { display: inline-grid; place-items: center; min-width: 34px; height: 34px; padding: 0 8px; box-sizing: border-box; border-radius: 10px; background: var(--ink); color: var(--paper); font-family: var(--font-display); font-size: 17px; }
#toasts { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 90px); left: 50%; transform: translateX(-50%); display: grid; gap: 8px; justify-items: center; width: min(520px, calc(100% - 32px)); }
.toast { background: var(--ink); color: var(--paper); border-radius: 14px; padding: 8px 16px; font-weight: 700; font-size: 17px; text-align: center; animation: toastIn 0.25s ease-out; }
.toast.good { background: var(--leaf); color: var(--ink); border: 3px solid var(--ink); }
.toast.bad { background: var(--bubble); color: #fff; border: 3px solid var(--ink); }
@keyframes toastIn { from { transform: translateY(-10px) scale(0.9); opacity: 0; } }
#announce { position: absolute; left: 0; right: 0; top: 34%; text-align: center; font-family: var(--font-display); font-size: clamp(44px, 10vw, 110px); color: var(--sun); -webkit-text-stroke: 0.08em var(--ink); paint-order: stroke fill; text-shadow: 0 0.07em 0 var(--ink); pointer-events: none; padding: 0 16px; }
#announce.pop { animation: pop 0.45s cubic-bezier(.2, 1.6, .4, 1); }
#announce small { display: block; font-size: 0.32em; color: var(--paper); -webkit-text-stroke: 0.12em var(--ink); margin-top: 8px; }
@keyframes pop { from { transform: scale(0.3) rotate(-8deg); opacity: 0; } }
#scorebar { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); left: 50%; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: min(900px, calc(100% - 24px)); }
.pcard { display: flex; align-items: center; gap: 8px; background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; padding: 4px 10px 4px 4px; box-shadow: 0 3px 0 var(--ink); font-weight: 800; font-size: 15px; }
.pcard .dot { width: 24px; height: 24px; border-radius: 8px; border: 3px solid var(--ink); box-sizing: border-box; }
.pcard.out { opacity: 0.45; }
.pcard .crowns { font-family: var(--font-display); color: #c98a00; font-size: 16px; letter-spacing: 1px; }
#roundinfo { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 50%; transform: translateX(-50%); }
#tags { position: absolute; inset: 0; overflow: hidden; }
.tag { position: absolute; transform: translate(-50%, -100%); padding: 1px 9px; border-radius: 999px; border: 3px solid var(--ink); font-family: var(--font-display); font-size: 14px; white-space: nowrap; color: var(--ink); }
.pop3d { position: absolute; transform: translate(-50%, -50%); font-family: var(--font-display); color: var(--sun); -webkit-text-stroke: 0.1em var(--ink); paint-order: stroke fill; font-size: 30px; animation: float3d 0.9s ease-out forwards; white-space: nowrap; }
.pop3d.coin { color: var(--sun); font-size: 24px; } .pop3d.ko { color: var(--bubble); font-size: 40px; }
@keyframes float3d { 0% { transform: translate(-50%, -50%) scale(0.4); opacity: 0; } 15% { transform: translate(-50%, -60%) scale(1.15); opacity: 1; } 100% { transform: translate(-50%, -160%) scale(1); opacity: 0; } }
/* menus */
.seg { display: inline-flex; border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; box-shadow: 0 4px 0 var(--ink); }
.seg button { border: 0; background: var(--paper); padding: 8px 14px; font-weight: 800; font-size: 16px; cursor: pointer; min-height: 42px; }
.seg button + button { border-left: 3px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--sun); }
.grid-picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.pick { border: 4px solid var(--ink); border-radius: 18px; background: #fff; padding: 12px; text-align: left; cursor: pointer; box-shadow: 0 4px 0 var(--ink); display: grid; gap: 4px; min-width: 0; }
.pick[aria-pressed="true"] { background: var(--sun); transform: translateY(-2px); box-shadow: 0 6px 0 var(--ink); }
.pick b { font-family: var(--font-display); font-weight: 400; font-size: 19px; }
.pick span { font-size: 14px; color: var(--muted); line-height: 1.25; }
.pick .sw { height: 10px; border-radius: 5px; border: 2px solid var(--ink); }
.field { display: grid; gap: 8px; margin: 14px 0; }
.field > label, .field > .lbl { font-family: var(--font-display); font-size: 17px; letter-spacing: 0.5px; }
.slots { display: grid; gap: 8px; }
.slot { display: flex; align-items: center; gap: 10px; border: 3px dashed var(--ink); border-radius: 14px; padding: 8px 12px; font-weight: 700; min-width: 0; flex-wrap: wrap; }
.slot.on { border-style: solid; background: #fff; }
.slot .dot { width: 22px; height: 22px; border-radius: 7px; border: 3px solid var(--ink); flex: none; }
input[type="range"] { width: 100%; accent-color: var(--bubble); height: 28px; }
.stepper { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.stepper button { width: 44px; height: 44px; border-radius: 12px; border: 3px solid var(--ink); background: var(--paper); box-shadow: 0 3px 0 var(--ink); font-family: var(--font-display); font-size: 22px; cursor: pointer; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 40px; height: 40px; border-radius: 12px; border: 3px solid var(--ink); cursor: pointer; box-shadow: 0 3px 0 var(--ink); }
.swatch[aria-pressed="true"] { outline: 4px solid var(--ink); outline-offset: 2px; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.item { border: 3px solid var(--ink); border-radius: 16px; background: #fff; padding: 10px; display: grid; gap: 6px; justify-items: start; min-width: 0; }
.item b { font-family: var(--font-display); font-weight: 400; font-size: 17px; }
.item .price { font-weight: 800; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 6px; }
.item.worn { background: #fff3c4; }
.side-panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); display: grid; align-content: center; padding: 16px; box-sizing: border-box; z-index: 20; }
.side-panel .card { max-height: calc(100vh - 32px); }
.controls-table { width: 100%; border-collapse: collapse; font-size: 16px; }
.controls-table th, .controls-table td { text-align: left; padding: 6px 8px; border-bottom: 2px dashed #e4d7c2; vertical-align: top; }
.controls-table th { font-family: var(--font-display); font-weight: 400; font-size: 15px; }
.tips { margin: 10px 0 0; padding-left: 20px; line-height: 1.45; }
.tbl-wrap { overflow-x: auto; }
.results-list { display: grid; gap: 8px; margin: 12px 0 18px; }
.res { display: flex; align-items: center; gap: 10px; border: 3px solid var(--ink); border-radius: 14px; padding: 6px 12px; background: #fff; font-weight: 800; }
.res .dot { width: 22px; height: 22px; border-radius: 7px; border: 3px solid var(--ink); }
.res .crowns { margin-left: auto; font-family: var(--font-display); color: #c98a00; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
.res.win { background: #fff3c4; }
#hint { position: absolute; left: 14px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 4px 0 var(--ink); padding: 8px 12px; display: grid; grid-template-columns: auto auto; gap: 4px 10px; align-items: center; font-weight: 700; font-size: 14px; transition: opacity 0.6s; max-width: calc(100% - 28px); box-sizing: border-box; }
#hint .key { min-width: 28px; height: 26px; font-size: 13px; border-radius: 8px; justify-self: start; }
#hint.fade { opacity: 0; }
#hud.brawl #hint { bottom: calc(env(safe-area-inset-bottom, 0px) + 112px); }
body.touch #hint { display: none; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--sky); z-index: 50; font-family: var(--font-display); font-size: 28px; }
#err { position: fixed; inset: auto 16px 16px 16px; background: var(--bubble); color: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 10px 14px; z-index: 60; font-weight: 700; }
/* missions */
.talk-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.talk-head .dot { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--ink); flex: none; }
.mtitle { font-family: var(--font-display); font-weight: 400; font-size: 22px; margin: 6px 0 4px; color: #c98a00; }
.say { font-size: 19px; font-weight: 700; line-height: 1.4; margin: 6px 0; }
.prize { font-weight: 700; margin: 8px 0 0; }
/* map */
#minimap { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 74px); right: 14px; width: 150px; height: 150px; border-radius: 50%; border: 4px solid var(--ink); box-shadow: 0 5px 0 var(--ink); background: #1f7fc0; pointer-events: auto; cursor: pointer; box-sizing: border-box; }
.map-screen { padding: 12px; }
.map-card { width: min(calc(100vh - 150px), 100%, 860px); padding: 14px 16px 16px; }
.map-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.map-head h2 { font-size: clamp(22px, 3.4vw, 30px); }
.map-head .lead { margin-bottom: 8px; font-size: 15px; }
.map-wrap { position: relative; width: 100%; aspect-ratio: 1; border: 4px solid var(--ink); border-radius: 18px; overflow: hidden; background: #1f7fc0; }
.map-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.map-pins { position: absolute; inset: 0; }
.map-label { position: absolute; transform: translate(-50%, -50%); font-family: var(--font-display); font-size: clamp(12px, 1.9vw, 17px); color: var(--paper); -webkit-text-stroke: 0.2em var(--ink); paint-order: stroke fill; white-space: nowrap; pointer-events: none; }
.map-label.small { font-size: clamp(10px, 1.4vw, 13px); }
.map-bus { position: absolute; transform: translate(-50%, -50%); font-family: var(--font-display); font-size: clamp(12px, 1.7vw, 16px); background: var(--sun); border: 3px solid var(--ink); border-radius: 999px; padding: 4px 12px; box-shadow: 0 3px 0 var(--ink); white-space: nowrap; cursor: pointer; }
.map-bus:hover { filter: saturate(1.2); transform: translate(-50%, -58%); }
.map-bus:focus-visible { outline: 4px solid var(--sea); outline-offset: 2px; }
.map-bus.here { background: var(--paper); cursor: default; }
.map-bus.dot { width: 16px; height: 16px; padding: 0; box-shadow: none; }
.map-bang { position: absolute; transform: translate(-50%, -50%); font-family: var(--font-display); font-size: clamp(16px, 2.4vw, 22px); color: #ffd84d; -webkit-text-stroke: 0.22em var(--ink); paint-order: stroke fill; pointer-events: none; }
.flash { position: fixed; inset: 0; background: #fff7e8; z-index: 40; pointer-events: none; animation: flash 0.7s ease-out forwards; }
@keyframes flash { from { opacity: 1; } to { opacity: 0; } }
@media (max-width: 560px) { #minimap { width: 112px; height: 112px; } }
/* online */
.txt { font: 700 20px var(--font-body); color: var(--ink); background: #fff; border: 4px solid var(--ink); border-radius: 16px; padding: 10px 14px; min-height: 54px; box-sizing: border-box; width: 100%; -webkit-user-select: text; user-select: text; touch-action: manipulation; box-shadow: inset 0 3px 0 rgba(43, 27, 63, 0.08); }
.txt:focus { outline: 4px solid var(--sea); outline-offset: 2px; }
.txt.code { font-family: var(--font-display); font-weight: 400; font-size: 26px; letter-spacing: 6px; text-transform: uppercase; text-align: center; width: 9.5ch; flex: none; padding: 8px 10px; }
.txt::placeholder { color: #b9abc9; letter-spacing: normal; }
.btn.wide { width: 100%; }
.btn.big { font-size: 26px; min-height: 64px; }
.join-row { margin-top: 10px; }
.games { display: grid; gap: 8px; }
.game { display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto; column-gap: 12px; align-items: center; text-align: left; background: #fff; border: 4px solid var(--ink); border-radius: 18px; box-shadow: 0 4px 0 var(--ink); padding: 10px 14px; cursor: pointer; min-height: 64px; }

  // ---- a game room. The host links to up to 3 guests and passes each guest's hero on to the others,

  // ---- the lobby (what the game gets instead of claude.use('room')) ----

  // host: announce the game on every route (a PeerJS game id and a retained MQTT message) and answer join offers from both
