# Makes the recorded voices for Flop Island (tools/flopvoices/make.py, with the open Kokoro voice generator; no account, no payment).
# Runs when tools/flopvoices/ changes on main, or from the Actions tab ("Run workflow").
# The voices go to the branch 'flop-voice-out', folder voice/ (one <hash>.mp3 per line, plus index.json); they are not part of the site.
# The Flop Island page asks for voice/<hash>.mp3 next to itself, so copy that folder next to the game page when you publish it.
name: Make the Flop Island voices (Kokoro)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/flopvoices/**']
permissions:
  contents: write
concurrency:
  group: flop-voices
  cancel-in-progress: false
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Open the results branch
        run: |
          git config --global user.name "voice-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin flop-voice-out >/dev/null 2>&1; then
            git fetch --depth=1 origin flop-voice-out
            git worktree add -b flop-voice-out out FETCH_HEAD
          else
            git worktree add --detach out
            cd out
            git checkout --orphan flop-voice-out
            git rm -rfq . || true
            git clean -fdxq
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the voice generator
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q kokoro-onnx soundfile numpy
          curl -fsSL --retry 3 --retry-delay 5 -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -fsSL --retry 3 --retry-delay 5 -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          ls -la kokoro-v1.0.onnx voices-v1.0.bin
      - name: Make the voices
        env:
          VOICE_OUT: ${{ github.workspace }}/out/voice
        run: python3 tools/flopvoices/make.py
      - name: Save the results
        if: always()
        run: |
          cd out
          git add -A
          git commit -qm "Flop Island voices run ${{ github.run_number }}" || echo "nothing new to save"
          git push -q origin HEAD:flop-voice-out
